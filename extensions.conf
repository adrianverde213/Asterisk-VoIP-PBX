; extensions.conf - Asterisk dial plan
;
; This file implements the functions available to the SIP and IAX2 subscribers.
;
; It is a static file: the PBX must be reloaded after every modification.

[general] ; global section
static=yes ; the file is static
writeprotect=n ; allows the file to be modified from the CLI

[incoming] ; context for calls coming from outside
include => internal ; apply the rules of the "internal" context

[internal] ; internal context

; ---------------------------------------------------------------------------
; Extension 1000: Dictate function for SIP subscribers (IAX2 calls are rejected)
; ---------------------------------------------------------------------------
; The first 3 characters of the name of the calling channel are compared with
; "SIP". If they match, execution continues at the label "fctsip1"; otherwise
; it continues with line 2, which ends the call with Hangup().
exten => 1000,1,GotoIf($[${CHANNEL:0:3}=SIP]?fctsip1)
same=>2,Hangup()
same=>3(fctsip1),Ringing() ; play the ringing tone
same=>4,Answer() ; answer the call
same=>5,Wait(1) ; wait one second
; Dictate() offers the caller several options, such as recording their voice
; and listening to the recording, controlled by pressing certain keys.
; The recorded audio files are saved under the path given in parentheses.
same=>6,Dictate(/var/spool/asterisk/dictari/1471)
same=>7,Wait(5) ; wait 5 seconds
same=>8,Hangup(17) ; hang up, reporting the cause code 17

; ---------------------------------------------------------------------------
; Extension 1471: SIP subscriber
; ---------------------------------------------------------------------------
; The variable "src" stores the name of the channel from which 1471 is called.
exten =>1471,1,Set(src=${CHANNEL})
; The variable "dst" stores the channel used to reach subscriber 1471.
same=>2,Set(dst=SIP/1471)
; If both the calling channel and the destination channel are SIP, jump to
; the label "monitor".
same=>3,GotoIf($["${src:0:3"="SIP"&"${dst:0:3}"="SIP"]?monitor)
; Place a call to SIP/1471 with a maximum ringing time of 20 seconds.
same=>4,Dial(${dst},20)
same=>5,Hangup() ; close the call after the conversation
; Monitor() records the audio of the whole conversation and saves it as
; /var/spool/asterisk/monitor/file1471.wav. The "m" parameter mixes caller and
; callee into a single audio file. The file can be played back with the "play"
; command from the directory where it is saved.
same=>6(monitor),Monitor(wav,file1471,m)
same=>7,Dial(SIP/1471,20) ; same as line 4
same=>8,Hangup() ; same as line 5

; ---------------------------------------------------------------------------
; Extension 2471: SIP subscriber (same implementation as 1471)
; ---------------------------------------------------------------------------
exten => 2471,1,Set(src=${CHANNEL})
same=>2,Set(dst=SIP/2471)
same=>3,GotoIf($["${src:0:3"="SIP"&"${dst:0:3}"="SIP"]?monitor)
same=>4,Dial(${dst},20)
same=>5,Hangup()
same=>6(monitor),Monitor(wav,file1471,m)
same=>7,Dial(SIP/2471,20)
same=>8,Hangup()

; ---------------------------------------------------------------------------
; Extension 3471: IAX2 subscriber (same structure as 1471 and 2471)
; ---------------------------------------------------------------------------
exten => 3471,1,Set(src=${CHANNEL})
same=>2,Set(dst=IAX2/3471)
same=>3,GotoIf($["${src:0:4"="IAX2" & "${DST:0:4}" = "IAX2"]?voicemail)
same=>4,Dial(${dst},20)
same=>5,Hangup()
; After the jump to the label "voicemail" (both subscribers are IAX2),
; IAX2/3471 is called.
same=>6(voicemail),Dial(${dst},20)
; If 3471 rejects the call, jump to the label "busy".
same=>7,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
; Voicemail() uses 3471 as the number of the voicemail box of subscriber 3471,
; defined in voicemail.conf in the "default" context.
same=>8,Voicemail(3471@default)
same=>9,Hangup() ; close the call
; Similar to line 8, but when the subscriber rejects the call, the "u"
; parameter changes the audio message played by this application.
same=>10(busy),Voicemail(3471@default,u)
same=>11,Hangup()

; ---------------------------------------------------------------------------
; Extension 4471: IAX2 subscriber (same as 3471)
; ---------------------------------------------------------------------------
exten => 4471,1,Set(src=${CHANNEL})
same=>2,Set(dst=IAX2/4471)
same=>3,GotoIf($["${src:0:4"="IAX2" & "${DST:0:4}" = "IAX2"]?voicemail2)
same=>4,Dial(${dst},20)
same=>5,Hangup()
same=>6(voicemail2),Dial(${dst},20)
same=>7,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy2)
same=>8,Voicemail(4471@default)
same=>9,Hangup()
same=>10(busy2),Voicemail(4471@default,u)
same=>11,Hangup()

; ---------------------------------------------------------------------------
; Extension 1001: Record function for SIP subscribers
; ---------------------------------------------------------------------------
; Same as 1000 up to line 3: only SIP callers are accepted.
exten =>1001,1,GotoIf($[${CHANNEL:0:3}=SIP]?fctsip2)
same=>2,Hangup()
same=>3(fctsip2),Answer()
; Record() records what the caller says and saves it in WAV format at the given
; path. The first numeric parameter ("5") is the number of seconds of silence
; after which the recording stops if nothing is said; the second ("10") is the
; maximum recording time in seconds. The option "x" ignores key presses and
; keeps recording until the maximum time elapses or the call is closed.
same=>4,Record(/var/spool/asterisk/recordings/mesaj2471.wav,5,10,x)
same=>5,Wait(1)
same=>6,Playback(beep) ; play a "beep" sound
same=>7,Wait(1)
; Play back the message recorded above; the beep marks the beginning of the
; playback (optional).
same=>8,Playback(/var/spool/asterisk/recordings/mesaj2471)
same=>9,Hangup()

; ---------------------------------------------------------------------------
; Extension 2000: voicemail access for IAX2 subscribers (mailbox number + PIN)
; ---------------------------------------------------------------------------
; Check that the caller is an IAX2 subscriber.
exten => 2000,1,GotoIf($[${CHANNEL:0:4}=IAX2]?authok)
same=>2,Playback(auth-denied) ; audio message: access denied
same=>3,Hangup()
; VMAuthenticate() authenticates by the mailbox number and by its PIN.
; It asks for authentication for the voicemail box identified by the caller's
; number, in the "default" context.
same=>4(authok),VMAuthenticate(${CALLERID(num)},default)
same=>5,Playback(auth-success) ; audio message: access granted
; Open the voicemail interface for that number.
same=>6,VoiceMailMain(${CALLERID(num)})
same=>7,Hangup()

; ---------------------------------------------------------------------------
; Extension 2001: access with PIN only for IAX2 subscribers
; ---------------------------------------------------------------------------
; Same as 2000 up to line 4.
exten => 2001,1,GotoIf($[${CHANNEL:0:4}=IAX2]?authok1)
same=>2,Playback(auth-denied)
same=>3,Hangup()
; Authenticate() does not need the mailbox number, only the PIN ("1234"),
; which is given here as a parameter.
same=>4(authok1),Authenticate(1234,a)
same=>5,Playback(auth-success)
same=>6,VoiceMailMain(${CALLERID(num)})
same=>7,Hangup()
