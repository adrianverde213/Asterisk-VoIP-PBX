;
; SIP configuration for Asterisk
;
; Note: read the Asterisk security documentation to understand the risks of
; installing Asterisk with a sample configuration. If Asterisk is installed on
; a public IP address connected to the Internet, learn about the various
; security settings BEFORE starting Asterisk.
; The credentials below are test credentials for a lab environment.
;

[general] ; general settings
context=default ; default context for incoming calls
disallow=all ; first reject all codecs, then allow only the desired ones
              ; in the order of preference
allow=ulaw ; allow the u-law audio codec
allow=alaw ; allow the A-law audio codec
allow=gsm ; allow the GSM compression codec, used for narrow-band networks
allow=ilbc ; allow the iLBC (internet Low Bitrate Codec) codec, used for audio
           ; transmission where bandwidth is very narrow or the network is
           ; unstable
allow=h264 ; allow the h264 video codec
allow=h263 ; allow the h263 video codec

[1471] ; defines subscriber 1471
; Type "friend" so that the subscriber can both receive and place calls
type=friend
host=dynamic ; the IP address of the SIP subscriber is dynamic, i.e. it can
             ; change over time
secret=1234 ; password "1234" used by the SIP subscriber to log in
context=internal ; section of "extensions.conf" that handles the calls of the
                 ; SIP subscribers
dtmfmode=rfc2833 ; use the rfc2833 method to transmit DTMF signals
nat=yes ; use the public IP address instead of the private one
canreinvite=no ; do not allow media to flow directly between the endpoints;
               ; it must pass through Asterisk
videosupport=yes ; allow video calls to be processed and handled
allow=h264 ; allow h264 for video calls
allow=h263 ; allow h263 for video calls

[2471] ; defines subscriber 2471 with the same settings as 1471
type=friend
host=dynamic
secret=1234
context=internal
dtmfmode=rfc2833
mat=yes
canreinvite=no
videosupport=yes
allow=h264
allow=h263
