; Inter-Asterisk eXchange (IAX2) driver definition
; The credentials below are test credentials for a lab environment.

[general] ; start of the general configuration section
disallow=all ; disable all audio codecs first, as a cleanup measure
allow=ulaw ; enable the u-law codec for calls
allow=alaw ; allow the A-law audio codec
allow=gsm ; allow the GSM compression codec, used for narrow-band networks
           ; (higher compression, lower quality)
allow=ilbc ; enable the iLBC codec, used for audio transmission where bandwidth
           ; is very narrow or packets are lost

[3471] ; defines subscriber 3471
; Type "friend": the subscriber can both place and receive calls.
type=friend
host=dynamic ; the client IP address is not fixed; it registers dynamically
secret=1234 ; password used by the client to authenticate
context=internal ; section of "extensions.conf" that handles the calls of the
                 ; IAX subscribers
qualify=yes ; Asterisk periodically sends "ping" packets to the client to check
            ; whether it is online
dtmfmode=rfc2833 ; mode used to transmit DTMF signals, according to RFC 2833

[4471] ; defines subscriber 4471; the settings below have the same meaning as
       ; the ones commented above
type=friend
host=dynamic
secret=1234
context=internal
qualify=yes
dtmfmode=rfc2833
