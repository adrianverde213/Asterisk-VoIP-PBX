; voicemail.conf - voicemail configuration
; The credentials below are test credentials for a lab environment.

[general] ; start of the general voicemail configuration section
#include vm_general.inc ; general voicemail settings (file not included in this repository)
#include vm_email.inc ; e-mail notification settings (file not included in this repository)

[default] ; defines a voicemail context named "default"
; Format: mailbox => PIN, display name
3471=>1234,IAX2 subscriber 3471 ; voicemail box of subscriber 3471 and the name associated with it
4471=>1234,IAX2 subscriber 4471 ; voicemail box of subscriber 4471 and the name associated with it
